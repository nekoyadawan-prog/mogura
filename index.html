<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>全開！フェイスアップ・マスター</title>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
    width: 100%; height: 100%; overflow: hidden; position: fixed; top: 0; left: 0;
    background: #12203a;
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    color: #fff;
}

/* ===== 店内の背景（床タイル + 蛍光灯） ===== */
#game-container {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    position: relative;
    background-color: #2b4a73;
    background-image: conic-gradient(#2f5280 25%, #2a4a74 0 50%, #2f5280 0 75%, #2a4a74 0);
    background-size: 56px 56px;
}
#game-container::before {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 120px;
    background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(255,255,255,0));
    pointer-events: none; z-index: 1;
}
#game-container.shake { animation: shake 0.25s; }
@keyframes shake {
    0%,100% { transform: translate(0,0); }
    20% { transform: translate(-6px, 2px); }
    40% { transform: translate(6px, -2px); }
    60% { transform: translate(-4px, 1px); }
    80% { transform: translate(4px, -1px); }
}

header {
    width: 100%; padding: 8px 14px;
    background: rgba(8, 15, 32, 0.82);
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10;
}
.status-box { display: flex; flex-direction: column; gap: 1px; }
.status-title { font-size: 10px; color: #9fb3d1; letter-spacing: 0.5px; }
.status-value { font-size: 22px; font-weight: 900; color: #fbbf24; line-height: 1.1; }
.status-sub { font-size: 11px; color: #9fb3d1; font-weight: 700; }
.timer-container { display: flex; flex-direction: column; align-items: center; }
.timer-value { font-size: 28px; font-weight: 900; color: #7dd3fc; text-shadow: 0 0 10px rgba(125,211,252,0.6); line-height: 1.1; }
.timer-value.urgent { color: #f87171; text-shadow: 0 0 10px rgba(248,113,113,0.7); }

.store-health-container {
    width: 100%; max-width: 520px; padding: 5px 14px 3px;
    background: rgba(8, 15, 32, 0.5);
    display: flex; flex-direction: column; align-items: center; z-index: 9;
}
.health-bar-bg {
    width: 100%; height: 14px; background: #13203a; border-radius: 8px; overflow: hidden;
    border: 2px solid #3a4c6e; margin-top: 2px; position: relative;
}
.health-bar-threshold { position: absolute; left: 75%; top: 0; bottom: 0; width: 3px; background: #fbbf24; z-index: 5; box-shadow: 0 0 5px #fbbf24; }
.health-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #10b981, #34d399); transition: width 0.1s linear; }

/* ===== 店長 + コンボ ===== */
#manager-row {
    width: 100%; max-width: 520px; display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; z-index: 9;
}
#manager-face {
    width: 54px; height: 54px; flex: none; border-radius: 50%;
    background: #e0f2fe; border: 3px solid #1d4ed8; overflow: hidden;
    box-shadow: 0 3px 8px rgba(0,0,0,0.5);
}
#manager-face svg { width: 100%; height: 100%; display: block; }
#manager-bubble {
    flex: 1; min-height: 40px; background: #fff; color: #111827; border-radius: 12px;
    padding: 6px 10px; font-size: 12px; font-weight: 800; line-height: 1.35;
    display: flex; align-items: center; position: relative; box-shadow: 0 3px 8px rgba(0,0,0,0.35);
}
#manager-bubble::before {
    content: ''; position: absolute; left: -7px; top: 50%; transform: translateY(-50%);
    border: 7px solid transparent; border-right-color: #fff; border-left: 0;
}
#combo-box {
    flex: none; width: 74px; text-align: center; background: rgba(8,15,32,0.8);
    border: 2px solid #475b80; border-radius: 12px; padding: 3px 0;
}
#combo-box.hot { border-color: #fbbf24; box-shadow: 0 0 12px rgba(251,191,36,0.7); }
#combo-num { font-size: 22px; font-weight: 900; color: #fbbf24; line-height: 1; }
#combo-label { font-size: 9px; color: #9fb3d1; letter-spacing: 1px; }
#combo-mult { font-size: 12px; font-weight: 900; color: #7dd3fc; }
#combo-box.pulse #combo-num { animation: comboPulse 0.2s; }
@keyframes comboPulse { 0% { transform: scale(1.5); } 100% { transform: scale(1); } }

/* ===== 棚 ===== */
main {
    flex: 1 1 0; min-height: 0; width: 100%; max-width: 520px; padding: 8px 10px;
    display: grid; gap: 8px; position: relative; z-index: 20;
}
main.grid-3x3 { grid-template-columns: repeat(3, minmax(0,1fr)); grid-template-rows: repeat(3, minmax(0,1fr)); }
main.grid-4x3 { grid-template-columns: repeat(3, minmax(0,1fr)); grid-template-rows: repeat(4, minmax(0,1fr)); }

.shelf-slot {
    position: relative; overflow: hidden; border-radius: 8px; cursor: pointer;
    background: linear-gradient(180deg, #f1f5fb 0%, #cdd8e8 100%);
    border: 3px solid #94a3b8;
    box-shadow: 0 0 0 2px #475569, 0 6px 10px rgba(0,0,0,0.45), inset 0 6px 10px rgba(30,41,59,0.35);
}
.shelf-slot::after {   /* 棚の天板の影 */
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 14px; z-index: 6;
    background: linear-gradient(180deg, rgba(15,23,42,0.45), rgba(15,23,42,0)); pointer-events: none;
}
.shelf-slot.highlight { border-color: #fbbf24; box-shadow: 0 0 16px rgba(251,191,36,0.9), 0 0 0 2px #b45309; animation: pulseHighlight 0.8s infinite alternate; }
.shelf-slot.incoming { border-color: #38bdf8; box-shadow: 0 0 14px rgba(56,189,248,0.9), 0 0 0 2px #0369a1; }
.shelf-slot.pop { animation: slotPop 0.22s; }
.shelf-slot.big-pop { animation: bigPop 0.38s; }
.shelf-slot.glow { border-color: #facc15; box-shadow: 0 0 26px rgba(253,224,71,0.95), 0 0 0 3px #eab308; }
@keyframes bigPop { 0% { transform: scale(1); } 35% { transform: scale(1.15); } 60% { transform: scale(0.97); } 100% { transform: scale(1); } }
/* 乱れた棚は暗く沈んで見える */
.shelf-slot::before {
    content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(circle at 50% 85%, rgba(30,41,59,0.2), rgba(15,23,42,0.95));
    opacity: calc(var(--rec, 0) * 0.8); transition: opacity 0.25s;
}
/* 引っ張り出し成功の強烈演出 */
.fx-flash { position: absolute; inset: 0; z-index: 30; background: #fff; pointer-events: none; animation: fxFlash 0.45s ease-out forwards; }
@keyframes fxFlash { 0% { opacity: 0.95; } 100% { opacity: 0; } }
.fx-sweep {
    position: absolute; top: -20%; bottom: -20%; left: -40%; width: 40%; z-index: 31; pointer-events: none;
    background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,0.95), rgba(255,255,255,0));
    transform: skewX(-15deg); animation: fxSweep 0.55s ease-out forwards;
}
@keyframes fxSweep { 0% { left: -40%; } 100% { left: 120%; } }
.fx-sparkle {
    position: absolute; z-index: 32; pointer-events: none; color: #fff7ae; font-size: 18px;
    text-shadow: 0 0 8px #fbbf24, 0 0 14px #fff; animation: fxSpark 0.75s ease-out forwards; opacity: 0;
}
@keyframes fxSpark { 0% { opacity: 0; transform: scale(0) rotate(0deg); } 40% { opacity: 1; transform: scale(1.6) rotate(90deg); } 100% { opacity: 0; transform: scale(0.6) rotate(180deg); } }
.fx-ring {
    position: absolute; left: 50%; top: 55%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
    border: 4px solid #fde047; z-index: 29; pointer-events: none; animation: fxRing 0.55s ease-out forwards;
}
@keyframes fxRing { 0% { transform: scale(0.3); opacity: 1; } 100% { transform: scale(7); opacity: 0; } }
.floating-score.big { font-size: 32px; animation-duration: 1s; }

/* ===== お客さんの「やっぱいらない、急いでるし」演出 ===== */
.shelf-slot .customer { top: 32px; }
.cust-bubble {
    position: absolute; left: 4px; right: 4px; top: 4px; z-index: 27; text-align: center;
    background: #fff; color: #111827; border: 2px solid #1b1b2f; border-radius: 10px;
    font-size: 9px; font-weight: 900; padding: 2px 4px; line-height: 1.3; pointer-events: none;
    animation: popInR 0.2s ease-out; transform-origin: bottom right;
}
.cust-bubble.rush { background: #fee2e2; color: #b91c1c; border-color: #b91c1c; animation: bubbleShake 0.22s infinite; }
@keyframes popInR { 0% { transform: scale(0); } 100% { transform: scale(1); } }
@keyframes bubbleShake { 0%, 100% { transform: translateX(0) rotate(0); } 50% { transform: translateX(-2px) rotate(-2deg); } }
.cust-item {
    position: absolute; right: 38px; top: 46px; width: 32px; height: 32px; z-index: 26; pointer-events: none;
    animation: itemWobble 0.5s infinite alternate;
}
.cust-item svg, .cust-grab svg { width: 100%; height: 100%; display: block; overflow: visible; }
.cust-item.rush { animation: itemWobble 0.12s infinite alternate; }
@keyframes itemWobble { 0% { transform: rotate(-14deg); } 100% { transform: rotate(14deg) translateY(-2px); } }
.customer.hurry { animation: hurryShake 0.1s infinite alternate; }
@keyframes hurryShake { 0% { transform: translateX(-2px) rotate(-3deg); } 100% { transform: translateX(2px) rotate(3deg); } }
.customer.dashing { animation: dash 0.32s ease-in forwards; }
@keyframes dash { 0% { transform: translateX(0) skewX(0); opacity: 1; } 100% { transform: translateX(120px) skewX(-22deg); opacity: 0; } }
.speed-lines {
    position: absolute; right: 100%; top: 10px; width: 34px; height: 26px;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.95) 0 2px, transparent 2px 7px);
}
.sweat { position: absolute; left: -10px; top: -2px; font-size: 13px; animation: alertBlink 0.25s infinite alternate; }
.cust-grab { position: absolute; left: 30%; top: 45%; width: 36px; height: 36px; z-index: 26; pointer-events: none; animation: grabFly 0.45s ease-in forwards; }
@keyframes grabFly { 0% { transform: scale(1.4) rotate(0); opacity: 1; } 100% { transform: translate(70px, -10px) scale(0.4) rotate(40deg); opacity: 0; } }
.misplaced-item.thrown {
    animation: throwIn 0.45s ease-out, pulseAttention 0.5s cubic-bezier(0.4, 0, 0.6, 1) 0.45s infinite alternate;
}
@keyframes throwIn {
    0% { transform: translate(55px, -15px) rotate(260deg) scale(0.4); opacity: 0; }
    55% { transform: translate(-6px, 6px) rotate(-14deg) scale(1.25); opacity: 1; }
    75% { transform: translate(0, -6px) rotate(6deg) scale(0.95); }
    100% { transform: none; opacity: 1; }
}
.customer-bubble.late { animation: popIn 0.2s ease-out 0.9s both; }
.fx-dust {
    position: absolute; left: 50%; bottom: 18px; width: 46px; height: 20px; margin-left: -23px; border-radius: 50%;
    background: radial-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0) 70%); z-index: 12; pointer-events: none;
    animation: dust 0.5s ease-out 0.28s both;
}
@keyframes dust { 0% { transform: scale(0.3); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(2.4, 1.6); opacity: 0; } }
.shelf-slot.slam { animation: slam 0.25s; }
@keyframes slam { 0% { transform: translateY(0); } 30% { transform: translateY(4px) scale(1.03); } 100% { transform: translateY(0); } }

/* ===== 中断ボタン ===== */
.header-left { display: flex; align-items: center; gap: 10px; }
#quit-btn {
    width: 30px; height: 30px; flex: none; border-radius: 50%; cursor: pointer;
    border: 2px solid #475b80; background: rgba(8,15,32,0.85); color: #cbd5e1; font-size: 14px; font-weight: 900; line-height: 1;
}
#quit-btn:active { transform: scale(0.9); }
#quit-overlay { z-index: 110; }
@keyframes pulseHighlight { 0% { transform: scale(0.98); } 100% { transform: scale(1.02); } }
@keyframes slotPop { 0% { transform: scale(1); } 40% { transform: scale(1.07); } 100% { transform: scale(1); } }

.item-stack { position: absolute; left: 0; right: 0; top: 8px; bottom: 20px; --rec: 0; }
.layer {
    position: absolute; left: 50%; bottom: 0; width: 64%; height: 82%;
    transform-origin: bottom center; z-index: calc(5 - var(--k));
    transform: translateX(-50%) translateY(calc(var(--rec) * -24px - var(--k) * 10px)) rotate(calc(var(--rec) * var(--tilt))) scale(calc(1 - var(--k) * 0.12 - var(--rec) * 0.36));
    filter: brightness(calc(1 - var(--k) * 0.14 - var(--rec) * 0.28));
    transition: transform 0.2s cubic-bezier(0.2, 1.5, 0.4, 1), filter 0.2s;
}
.layer svg { width: 100%; height: 100%; display: block; overflow: visible; }

.shelf-board {   /* 棚板の手前エッジ + 値札レール */
    position: absolute; left: 0; right: 0; bottom: 0; height: 20px; z-index: 7;
    background: linear-gradient(180deg, #e2e8f0 0%, #94a3b8 60%, #64748b 100%);
    border-top: 2px solid #475569;
}
.price-tag {
    position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
    background: #fff; color: #b91c1c; border: 1.5px solid #1b1b2f;
    font-size: 10px; font-weight: 900; padding: 0 6px; border-radius: 3px; z-index: 8; pointer-events: none;
}
.warning-border { position: absolute; inset: 0; border: 3px solid #ef4444; border-radius: 6px; pointer-events: none; z-index: 9; animation: warningBlink 0.3s infinite alternate; display: none; }
@keyframes warningBlink { 0% { opacity: 0.15; } 100% { opacity: 0.9; } }

.misplaced-item {
    position: absolute; top: 10%; left: 12%; width: 76%; height: 74%; z-index: 20; cursor: grab;
    filter: drop-shadow(0 6px 10px rgba(239,68,68,0.9));
    animation: pulseAttention 0.5s infinite alternate cubic-bezier(0.4, 0, 0.6, 1);
}
.misplaced-item svg { width: 100%; height: 100%; display: block; overflow: visible; }
@keyframes pulseAttention { 0% { transform: scale(0.95) rotate(-5deg); } 100% { transform: scale(1.12) rotate(5deg); } }
.misplaced-item.dragging {
    position: fixed !important; width: 70px !important; height: 70px !important; top: 0; left: 0;
    pointer-events: none; z-index: 1000; transform: translate(-50%, -50%) scale(1.15) !important;
    animation: none !important; filter: drop-shadow(0 12px 18px rgba(0,0,0,0.7));
}
.expired-stamp {
    position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%) rotate(-14deg);
    background: rgba(220,38,38,0.92); color: #fff; font-size: 11px; font-weight: 900;
    padding: 1px 5px; border: 2px solid #fff; border-radius: 4px; white-space: nowrap; pointer-events: none;
}
.customer-bubble {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 22;
    background: #ef4444; color: #fff; font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 8px;
    white-space: nowrap; pointer-events: none; box-shadow: 0 2px 6px rgba(0,0,0,0.5); animation: popIn 0.2s ease-out;
}
.customer-bubble.expired { background: #7c3aed; }
@keyframes popIn { 0% { transform: translateX(-50%) scale(0); } 100% { transform: translateX(-50%) scale(1); } }

/* ===== お客さん ===== */
.customer {
    position: absolute; right: 3px; top: 8px; width: 34px; height: 46px; z-index: 25; pointer-events: none;
    animation: walkIn 0.45s ease-out;
}
.customer svg { width: 100%; height: 100%; display: block; }
.customer.leaving { animation: walkOut 0.4s ease-in forwards; }
.cust-alert {
    position: absolute; left: -6px; top: -8px; width: 18px; height: 18px; border-radius: 50%;
    background: #fbbf24; color: #1b1b2f; font-size: 12px; font-weight: 900; text-align: center; line-height: 18px;
    border: 2px solid #1b1b2f; animation: alertBlink 0.3s infinite alternate;
}
@keyframes alertBlink { 0% { transform: scale(0.9); } 100% { transform: scale(1.2); } }
@keyframes walkIn { 0% { transform: translateX(50px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
@keyframes walkOut { 0% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(50px); opacity: 0; } }

/* ===== ゴミ箱 ===== */
#trash-zone {
    width: calc(100% - 20px); max-width: 500px; height: 46px; margin-bottom: 8px; flex: none; z-index: 20;
    background: rgba(15,23,42,0.85); border: 3px dashed #a78bfa; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    color: #c4b5fd; font-size: 13px; font-weight: 900;
}
#trash-zone.hidden { display: none; }

#fx-canvas { position: absolute; inset: 0; pointer-events: none; z-index: 500; }
.floating-score {
    position: absolute; font-size: 24px; font-weight: 900; color: #fbbf24; white-space: nowrap;
    text-shadow: 0 0 10px rgba(251,191,36,0.8), 2px 2px 0 #000; pointer-events: none; z-index: 600;
    animation: floatUp 0.7s ease-out forwards;
}
.floating-score.penalty { color: #f87171; text-shadow: 0 0 10px rgba(239,68,68,0.8), 2px 2px 0 #000; }
@keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 0) scale(0.5); }
    20% { opacity: 1; transform: translate(-50%, -15px) scale(1.2); }
    100% { opacity: 0; transform: translate(-50%, -40px) scale(0.9); }
}

/* ===== オーバーレイ ===== */
.overlay {
    position: absolute; inset: 0; background: rgba(10, 18, 36, 0.95);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 20px; text-align: center; z-index: 100; backdrop-filter: blur(4px); overflow-y: auto;
}
.overlay.hidden { display: none; }
.game-title { font-size: 25px; font-weight: 900; color: #fbbf24; margin-bottom: 4px; text-shadow: 0 0 15px rgba(251,191,36,0.4); }
.game-sub { font-size: 11px; color: #7dd3fc; letter-spacing: 2px; margin-bottom: 10px; font-weight: 700; }
.game-desc { font-size: 12px; color: #e5e7eb; margin-bottom: 14px; line-height: 1.6; }
.stars { font-size: 38px; color: #fbbf24; letter-spacing: 6px; margin-bottom: 8px; text-shadow: 0 0 14px rgba(251,191,36,0.6); }
.stats-line { font-size: 12px; color: #9fb3d1; margin-bottom: 12px; line-height: 1.6; }
.btn-group { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }
.start-btn {
    width: 100%; padding: 12px 20px; font-size: 16px; font-weight: 900; color: #fff;
    background: linear-gradient(135deg, #10b981, #059669); border: none; border-radius: 30px;
    box-shadow: 0 5px #047857, 0 8px 16px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.1s;
}
.start-btn:active { transform: translateY(3px); box-shadow: 0 2px #047857, 0 4px 8px rgba(0,0,0,0.5); }
.sub-btn { background: linear-gradient(135deg, #3b82f6, #1d4ed8); box-shadow: 0 5px #1e40af, 0 8px 16px rgba(0,0,0,0.5); }
.sub-btn:active { box-shadow: 0 2px #1e40af, 0 4px 8px rgba(0,0,0,0.5); }
.danger-btn { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 5px #b91c1c, 0 8px 16px rgba(0,0,0,0.5); }
.danger-btn:active { box-shadow: 0 2px #b91c1c, 0 4px 8px rgba(0,0,0,0.5); }

.ranking-board { width: 100%; max-width: 280px; background: rgba(31,41,55,0.8); border: 2px solid #374151; border-radius: 10px; padding: 10px; margin-bottom: 14px; }
.ranking-title { font-size: 12px; font-weight: bold; color: #fbbf24; margin-bottom: 6px; letter-spacing: 1px; }
.ranking-list { display: flex; flex-direction: column; gap: 4px; }
.ranking-item { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 8px; background: rgba(17,24,39,0.6); border-radius: 4px; color: #f3f4f6; }
.ranking-item:nth-child(1) { color: #fbbf24; font-weight: bold; }
.ranking-item:nth-child(2) { color: #e5e7eb; font-weight: bold; }
.ranking-item:nth-child(3) { color: #d1d5db; font-weight: bold; }

#tut-banner {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 440px;
    background: rgba(10,18,36,0.96); border: 2px solid #38bdf8; border-radius: 12px; padding: 10px 14px;
    z-index: 50; box-shadow: 0 10px 25px rgba(0,0,0,0.8); text-align: center; pointer-events: none;
}
#tut-banner.hidden { display: none; }
.tut-title { font-size: 14px; font-weight: 900; color: #7dd3fc; margin-bottom: 4px; }
.tut-text { font-size: 12.5px; color: #f3f4f6; line-height: 1.5; }
.tut-next-btn { margin-top: 8px; padding: 7px 18px; font-size: 13px; font-weight: bold; background: #38bdf8; color: #0f172a; border: none; border-radius: 15px; cursor: pointer; pointer-events: auto; }
.tut-next-btn.hidden { display: none; }
</style>
</head>
<body>

<div id="game-container">
    <canvas id="fx-canvas"></canvas>

    <header>
        <div class="header-left">
            <button id="quit-btn" title="タイトルに戻る" aria-label="タイトルに戻る">✕</button>
            <div class="status-box">
                <span class="status-title">STAGE</span>
                <span id="stage-val" class="status-value">1</span>
            </div>
        </div>
        <div class="timer-container">
            <span class="status-title">残り時間</span>
            <span id="timer-val" class="timer-value">25s</span>
        </div>
        <div class="status-box" style="text-align:right;">

class SoundEngine {
    constructor() { this.ctx = null; }
    init() {
        try {
            if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (this.ctx.state === 'suspended') this.ctx.resume();
        } catch (e) {}
    }
    tone(type, f0, f1, dur, vol, delay = 0) {
        if (!this.ctx) return;
        const t = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f0, t);
        if (f1 !== f0) osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + dur);
    }
    playTap(combo = 0) {
        const k = 1 + Math.min(combo, 14) * 0.045;
        this.tone('sine', 450 * k, 900 * k, 0.08, 0.22);
    }
    playFanfare() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.tone('triangle', f, f, 0.22, 0.28, i * 0.05)); }
    playToss() { this.tone('triangle', 520, 160, 0.12, 0.2); this.tone('triangle', 200, 70, 0.16, 0.3, 0.28); }
    playSparkle() { [1318.5, 1568, 2093, 2637].forEach((f, i) => this.tone('sine', f, f, 0.2, 0.16, i * 0.05)); }
    playError() { this.tone('sawtooth', 180, 60, 0.25, 0.35); }
    playClear() { [523.25, 659.25, 783.99, 987.77, 1046.5].forEach((f, i) => this.tone('sine', f, f, 0.28, 0.25, i * 0.08)); }
    playDamage() { this.tone('sawtooth', 150, 40, 0.35, 0.4); }
    playCustomer() { this.tone('sine', 880, 880, 0.1, 0.15); this.tone('sine', 660, 660, 0.14, 0.15, 0.1); }
}

/* ================= 店長 ================= */
function setManager(mood, text, lockMs = 0) {

    state.moodUntil = Date.now() + lockMs;
    state.lineAt = Date.now();
}
function autoMood() {
    if (Date.now() < state.moodUntil) return;
    const gap = state.storeHealth - Math.floor(state.normaRatio * 100);
    const mood = gap < 0 ? 'angry' : gap < 10 ? 'worry' : 'normal';
    if (mood !== state.mood || Date.now() - state.lineAt > 5000) setManager(mood);
}

/* ================= コンボ・スコア ================= */
function comboMult() { return 1 + Math.min(Math.floor(state.combo / 5), 4) * 0.5; }
function addCombo() {
    state.combo++;

    if (state.combo % 5 === 0) setManager('happy', `COMBO ${state.combo}！倍率アップ！`, 1500);
}
function breakCombo() { state.combo = 0; state.comboTime = 0; }
function gain(base) { const v = Math.floor(base * comboMult()); state.score += v; return v; }
function shake() { containerEl.classList.remove('shake'); void containerEl.offsetWidth; containerEl.classList.add('shake'); }
function missPenalty(x, y, label) {
    state.sound.playError();

/* ================= ランキング ================= */
function renderRankingBoard() {
    const rankings = loadRankings();

        const item = document.createElement('div');
        item.className = 'ranking-item';
        item.innerHTML = `<span>${i + 1}位</span><span>${rankings[i] !== undefined ? rankings[i] + ' pt' : '---'}</span>`;
        rankingListEl.appendChild(item);
    }
}
function commitRun() {
    if (state.runCommitted || state.isTraining) return false;
    state.runCommitted = true;
    const s = Math.floor(state.score);
    if (s <= 0) return false;
    let r = loadRankings();
    const prev = r[0] || 0;
    r.push(s); r.sort((a, b) => b - a); r = r.slice(0, 5);
    store.set(RANK_KEY, r);
    return s > prev;
}

/* ================= 棚の生成 ================= */
function setupStageLayout() {
    const big = !state.isTraining && state.stage >= 4;
    gridEl.className = big ? 'grid-4x3' : 'grid-3x3';
    state.availableProducts = big ? ALL_PRODUCTS : ALL_PRODUCTS.slice(0, 4);
    const total = big ? 12 : 9;
    gridEl.innerHTML = '';
    state.shelves = [];
    state.customers = [];

    const tilts = ['-7deg', '5deg', '-4deg'];
    for (let i = 0; i < total; i++) {
        const productType = state.availableProducts[i % state.availableProducts.length];
        const slot = document.createElement('div');
        slot.className = 'shelf-slot';
        slot.dataset.index = i;

        const stack = document.createElement('div');
        stack.className = 'item-stack';
        // 奥(k=2) → 手前(k=0) の順で描画
        for (let k = 2; k >= 0; k--) {
            const layer = document.createElement('div');
            layer.className = 'layer';
            layer.style.setProperty('--k', k);
            layer.style.setProperty('--tilt', tilts[k]);
            layer.innerHTML = productType.icon;
            stack.appendChild(layer);
        }
        slot.appendChild(stack);

        const board = document.createElement('div'); board.className = 'shelf-board'; slot.appendChild(board);
        const tag = document.createElement('div'); tag.className = 'price-tag'; tag.textContent = productType.price; slot.appendChild(tag);
        const warning = document.createElement('div'); warning.className = 'warning-border'; slot.appendChild(warning);

        gridEl.appendChild(slot);
        state.shelves.push({
            element: slot, stack, productType, cleanliness: 100,
            misplacedProduct: null, misplacedElement: null, customerBubble: null,
            warningElement: warning, expired: false
        });
    }
}

function renderShelves() {
    state.shelves.forEach(s => {
        const rec = Math.min(1, Math.max(0, (100 - s.cleanliness) / 70));
        s.stack.style.setProperty('--rec', rec.toFixed(3));
        s.element.style.setProperty('--rec', rec.toFixed(3));
        s.warningElement.style.display = (s.cleanliness < 40 || s.misplacedProduct) ? 'block' : 'none';
    });
}

function popShelf(shelf) {
    shelf.element.classList.remove('pop'); void shelf.element.offsetWidth; shelf.element.classList.add('pop');
    setTimeout(() => shelf.element.classList.remove('pop'), 230);
}

/* ================= 置き間違い・期限切れ ================= */
function spawnMisplacedItem(slotIndex, forcedProduct = null, expired = false, thrown = false) {
    const shelf = state.shelves[slotIndex];
    if (!shelf || shelf.misplacedProduct) return;

    let product = forcedProduct;
    if (expired) product = shelf.productType;
    if (!product) {
        const others = state.availableProducts.filter(p => p.id !== shelf.productType.id);
        product = pick(others);
    }

    const misEl = document.createElement('div');
    misEl.className = 'misplaced-item' + (thrown ? ' thrown' : '');
    misEl.innerHTML = product.icon + (expired ? '<div class="expired-stamp">期限切れ</div>' : '');
    misEl.addEventListener('pointerdown', e => startDrag(e, slotIndex, product));
    shelf.element.appendChild(misEl);
    shelf.misplacedProduct = product;
    shelf.misplacedElement = misEl;
    shelf.expired = expired;

    const bubble = document.createElement('div');
    bubble.className = 'customer-bubble' + (expired ? ' expired' : '') + (thrown ? ' late' : '');
    bubble.textContent = expired ? '期限切れ!' : thrown ? 'ココじゃない!' : 'ココに置こ';
    shelf.element.appendChild(bubble);
    shelf.customerBubble = bubble;
}

function clearMisplaced(shelf) {
    if (shelf.customerBubble) { shelf.customerBubble.remove(); shelf.customerBubble = null; }
    shelf.misplacedProduct = null;
    shelf.misplacedElement = null;
    shelf.expired = false;
}

/* ================= ドラッグ ================= */
function startDrag(e, sourceIndex, product) {
    e.preventDefault(); e.stopPropagation();
    if (state.activeDrag) return;
    const shelf = state.shelves[sourceIndex];
    const misEl = shelf.misplacedElement;
    if (!misEl) return;
    misEl.classList.add('dragging');
    document.body.appendChild(misEl);
    state.activeDrag = { element: misEl, sourceIndex, product, expired: shelf.expired };
    moveDrag(e);
    window.addEventListener('pointermove', moveDrag);
    window.addEventListener('pointerup', endDrag);
    window.addEventListener('pointercancel', endDrag);
}
function moveDrag(e) {
    if (!state.activeDrag) return;
    state.activeDrag.element.style.left = e.clientX + 'px';
    state.activeDrag.element.style.top = e.clientY + 'px';
}
function detachDragListeners() {
    window.removeEventListener('pointermove', moveDrag);
    window.removeEventListener('pointerup', endDrag);
    window.removeEventListener('pointercancel', endDrag);
}
function cancelDrag() {
    if (!state.activeDrag) return;
    detachDragListeners();
    state.activeDrag.element.remove();
    state.activeDrag = null;
}
function endDrag(e) {
    if (!state.activeDrag) return;
    detachDragListeners();
    const { element, sourceIndex, product, expired } = state.activeDrag;
    element.style.display = 'none';

    const dropTarget = document.elementFromPoint(e.clientX, e.clientY);
    const onTrash = dropTarget ? dropTarget.closest('#trash-zone') : null;
    const targetSlot = dropTarget ? dropTarget.closest('.shelf-slot') : null;
    const srcShelf = state.shelves[sourceIndex];

    const finishRemoved = () => { clearMisplaced(srcShelf); element.remove(); };

    if (expired) {
        if (onTrash) {
            const r = onTrash.getBoundingClientRect();
            const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
            state.sound.playFanfare(); addCombo(); vib(25);
            const v = gain(250);
            spawnParticles(cx, cy);
            showFloatingText(cx, cy - 10, `期限切れ回収！ +${v}`, false);
            setManager('happy', '期限切れ回収、助かる！', 1500);
            finishRemoved();
        } else if (targetSlot) {
            const r = targetSlot.getBoundingClientRect();
            missPenalty(r.left + r.width / 2, r.top + r.height / 2, 'ゴミ箱へ！ -80');
            returnToSource(sourceIndex, element);
        } else returnToSource(sourceIndex, element);
    } else if (onTrash) {
        const r = onTrash.getBoundingClientRect();
        missPenalty(r.left + r.width / 2, r.top + r.height / 2, '商品を捨てた！ -80');
        returnToSource(sourceIndex, element);
    } else if (targetSlot) {
        const targetIndex = parseInt(targetSlot.dataset.index);
        const targetShelf = state.shelves[targetIndex];
        const r = targetSlot.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;

        if (targetShelf.productType.id === product.id) {
            state.sound.playFanfare(); addCombo(); vib(25);
            const v = gain(200);
            const beforeClean = targetShelf.cleanliness;
            targetShelf.cleanliness = 100;
            popShelf(targetShelf);
            faceUpFx(targetShelf, beforeClean);
            spawnParticles(cx, cy);
            showFloatingText(cx, cy, `PERFECT! +${v}`, false);
            setManager('happy', 'ナイス戻し！', 1200);
            finishRemoved();
            if (state.isTraining && state.tutStep === 2) { clearHighlights(); advanceTutStep(3); }
        } else {
            targetShelf.cleanliness = Math.max(0, targetShelf.cleanliness - 40);
            srcShelf.cleanliness = Math.max(0, srcShelf.cleanliness - 20);
            missPenalty(cx, cy, 'MISPLACED! -80');
            returnToSource(sourceIndex, element);
        }
    } else {
        returnToSource(sourceIndex, element);
    }

    state.activeDrag = null;
    updateUI();
}
function returnToSource(sourceIndex, element) {
    element.classList.remove('dragging');
    element.style.display = '';
    element.style.left = ''; element.style.top = '';
    state.shelves[sourceIndex].element.appendChild(element);
}

/* ================= 演出 ================= */
function spawnParticles(x, y) {
    const colors = ['#fbbf24', '#34d399', '#f87171', '#7dd3fc', '#c084fc', '#ffffff'];
    for (let i = 0; i < 30; i++) {
        const a = Math.random() * Math.PI * 2, sp = Math.random() * 6 + 2.5;
        state.particles.push({
            x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.5,
            color: pick(colors), size: Math.random() * 4 + 2, alpha: 1, decay: Math.random() * 0.025 + 0.02
        });
    }
}
function showFloatingText(x, y, text, isPenalty, big = false) {
    const el = document.createElement('div');
    el.className = 'floating-score' + (isPenalty ? ' penalty' : '') + (big ? ' big' : '');
    el.textContent = text;
    el.style.left = x + 'px'; el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 700);
}
function updateFX() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.alpha -= p.decay;
        if (p.alpha <= 0) { state.particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
}
(function fxLoop() { updateFX(); requestAnimationFrame(fxLoop); })();

/* ===== 引っ張り出し成功の強烈演出（乱れていたほど派手） ===== */
function faceUpFx(shelf, before) {
    const sev = before < 40 ? 2 : before < 75 ? 1 : 0;
    if (sev === 0) return;
    const slot = shelf.element;
    const add = (cls, ms, txt) => {
        const d = document.createElement('div');
        d.className = cls;
        if (txt) d.textContent = txt;
        slot.appendChild(d);
        setTimeout(() => d.remove(), ms);
        return d;
    };
    add('fx-flash', 500);
    add('fx-sweep', 650);
    if (sev === 2) add('fx-ring', 600);
    const n = sev === 2 ? 9 : 4;
    for (let i = 0; i < n; i++) {
        const s = add('fx-sparkle', 1000, '✦');
        s.style.left = (6 + Math.random() * 84) + '%';
        s.style.top = (8 + Math.random() * 70) + '%';
        s.style.fontSize = (12 + Math.random() * 16) + 'px';
        s.style.animationDelay = (Math.random() * 0.25) + 's';
    }
    slot.classList.remove('big-pop', 'glow');
    void slot.offsetWidth;
    slot.classList.add(sev === 2 ? 'big-pop' : 'pop', 'glow');
    setTimeout(() => slot.classList.remove('big-pop', 'glow'), 500);

    const r = slot.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    state.sound.playSparkle();
    if (sev === 2) {
        spawnParticles(cx, cy);
        const tx = Math.min(Math.max(cx, 160), window.innerWidth - 160);
        showFloatingText(tx, cy - 8, 'ズラッ！ピカピカ！', false, true);
        vib([20, 30, 40]);
    } else {
        showFloatingText(Math.min(Math.max(cx, 70), window.innerWidth - 70), cy - 8, 'ピカッ！', false, true);
    }
}

/* ================= タップ & スワイプ ================= */
function onShelfTap(index) {
    if (!state.isPlaying && !(state.isTraining && state.tutStep === 1)) return;
    const shelf = state.shelves[index];
    if (!shelf || shelf.cleanliness >= 95) return;

    const before = shelf.cleanliness;
    shelf.cleanliness = 100;
    popShelf(shelf);
    faceUpFx(shelf, before);
    addCombo();
    state.sound.playTap(state.combo);

    const v = gain(15);
    const r = shelf.element.getBoundingClientRect();
    if (state.combo % 3 === 0) showFloatingText(r.left + r.width / 2, r.top + r.height / 2, `+${v}`, false);

    if (state.isTraining && state.tutStep === 1) { clearHighlights(); advanceTutStep(2); }
}
function tapIndex(i) { state.lastSwipe = i; onShelfTap(i); }

gridEl.addEventListener('pointerdown', e => {

});
window.addEventListener('pointermove', e => {

const stopSwipe = () => { state.swiping = false; state.lastSwipe = -1; };
window.addEventListener('pointerup', stopSwipe);
window.addEventListener('pointercancel', stopSwipe);

/* ================= お客さん ================= */
const SHIRTS = ['#ef4444', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'];
function spawnCustomers() {
    const maxC = state.isTraining ? 1 : Math.min(2 + Math.floor(state.stage / 2), 4);
    if (state.customers.length >= maxC) return;
    const chance = state.isTraining ? 0.015 : (0.03 + state.stage * 0.008);
    if (Math.random() >= chance) return;
    const free = [];
    state.shelves.forEach((s, i) => { if (!s.misplacedProduct && !state.customers.some(c => c.index === i)) free.push(i); });
    if (!free.length) return;
    const index = pick(free);
    const shelf = state.shelves[index];
    const slot = shelf.element;
    const type = Math.random() < 0.55 ? 'misplace' : 'take';
    let product = null;
    if (type === 'misplace') product = pick(state.availableProducts.filter(p => p.id !== shelf.productType.id));

    const el = document.createElement('div');
    el.className = 'customer';
    el.innerHTML = customerSVG(pick(SHIRTS)) + '<div class="cust-alert">!</div>';
    slot.appendChild(el);

    let itemEl = null;   // お客さんが手に持っている商品
    if (product) {
        itemEl = document.createElement('div');
        itemEl.className = 'cust-item';
        itemEl.innerHTML = product.icon;
        slot.appendChild(itemEl);
    }
    const bubble = document.createElement('div');
    bubble.className = 'cust-bubble';
    bubble.textContent = pick(type === 'misplace' ? THINK_LINES : TAKE_LINES);
    slot.appendChild(bubble);

    slot.classList.add('incoming');
    state.sound.playCustomer();
    state.customers.push({ index, type, t: 1.6, el, product, itemEl, bubble, phase: 0 });
}
const THINK_LINES = ['うーん…やっぱいらないな', 'これ…やっぱやめよかな'];
const RUSH_LINES = ['急いでるし…ここでいいや！', '時間ない！ここに置く！', 'まいっか、置いてこ！'];
const TAKE_LINES = ['これください！', 'ひとつ貰うね'];

function updateCustomers() {
    for (let i = state.customers.length - 1; i >= 0; i--) {
        const c = state.customers[i];
        c.t -= 0.1;

        // フェーズ2：慌てる（急いでるし…）
        if (c.type === 'misplace' && c.phase === 0 && c.t <= 0.7) {
            c.phase = 1;
            c.bubble.textContent = pick(RUSH_LINES);
            c.bubble.classList.add('rush');
            c.el.classList.add('hurry');
            const sw = document.createElement('div');
            sw.className = 'sweat'; sw.textContent = '💦';
            c.el.appendChild(sw);
            if (c.itemEl) c.itemEl.classList.add('rush');
        }
        if (c.t > 0) continue;

        const shelf = state.shelves[c.index];
        shelf.element.classList.remove('incoming');
        const el = c.el, bubble = c.bubble;
        if (c.itemEl) c.itemEl.remove();

        if (c.type === 'misplace' && !shelf.misplacedProduct) {
            // ポイッと投げて走り去る
            state.sound.playToss();
            spawnMisplacedItem(c.index, c.product, false, true);
            const dust = document.createElement('div');
            dust.className = 'fx-dust';
            shelf.element.appendChild(dust);
            setTimeout(() => dust.remove(), 900);
            setTimeout(() => {
                shelf.element.classList.add('slam');
                setTimeout(() => shelf.element.classList.remove('slam'), 260);
            }, 300);
            bubble.textContent = 'ポイッ！';
            bubble.classList.add('rush');
            setTimeout(() => bubble.remove(), 800);
            el.classList.remove('hurry');
            el.classList.add('dashing');
            const sp = document.createElement('div');
            sp.className = 'speed-lines';
            el.appendChild(sp);
            setTimeout(() => el.remove(), 350);
        } else {
            // 商品を持っていく
            const g = document.createElement('div');
            g.className = 'cust-grab';
            g.innerHTML = shelf.productType.icon;
            shelf.element.appendChild(g);
            setTimeout(() => g.remove(), 500);
            shelf.cleanliness = Math.max(0, shelf.cleanliness - 55);
            bubble.textContent = 'いただき！';
            setTimeout(() => bubble.remove(), 600);
            el.classList.add('leaving');
            setTimeout(() => el.remove(), 400);
        }
        state.customers.splice(i, 1);
    }
}

/* ================= メインループ ================= */
function gameLoop() {
    if (!state.isPlaying || state.paused) return;
    state.timeLeft -= 0.1;

    if (state.timeLeft <= 0) {
        state.timeLeft = 0;
        const target = Math.floor(state.normaRatio * 100);
        if (state.storeHealth < target) gameOver(`時間切れ時点で棚キレイ度が${target}%未満だったため不合格です！`);
        else stageClear();
        return;
    }

    if (state.combo > 0) {
        state.comboTime -= 0.1;
        if (state.comboTime <= 0) breakCombo();
    }

    spawnCustomers();
    updateCustomers();
    if (!state.isTraining && state.stage >= 3 && Math.random() < 0.008 + state.stage * 0.002) {
        const cands = [];
        state.shelves.forEach((s, i) => { if (!s.misplacedProduct) cands.push(i); });
        if (cands.length) spawnMisplacedItem(pick(cands), null, true);
    }

    const decay = state.isTraining ? 0.25 : (0.35 + state.stage * 0.12);
    let total = 0;
    state.shelves.forEach(s => {
        const penalty = s.misplacedProduct ? (s.expired ? 1.0 : 0.7) : 0;
        s.cleanliness = Math.max(0, s.cleanliness - (Math.random() * decay + penalty));
        total += s.cleanliness;
    });
    state.storeHealth = total / state.shelves.length;
    state.healthSum += state.storeHealth;
    state.healthTicks++;

    if (state.storeHealth <= 0) { gameOver('棚キレイ度が完全に底を突き、店舗が壊滅しました！'); return; }
    autoMood();
    updateUI();
}

function updateUI() {
    const best = loadRankings()[0] || 0;
    scoreEl.textContent = Math.floor(state.score);
    highScoreEl.textContent = best;
    stageEl.textContent = state.isTraining ? 'TR' : state.stage;
    timerEl.textContent = Math.ceil(state.timeLeft) + 's';
    timerEl.classList.toggle('urgent', state.isPlaying && state.timeLeft <= 5);
    healthBarEl.style.width = state.storeHealth + '%';

    const target = Math.floor(state.normaRatio * 100);
    normaLabelEl.textContent = `棚キレイ度（ノルマ: ${target}%以上でクリア）`;
    healthThresholdEl.style.left = target + '%';
    healthBarEl.style.background = state.storeHealth < target
        ? 'linear-gradient(90deg, #ef4444, #f87171)' : 'linear-gradient(90deg, #10b981, #34d399)';

    comboNumEl.textContent = state.combo;
    comboMultEl.textContent = '×' + comboMult().toFixed(1);
    comboBoxEl.classList.toggle('hot', state.combo >= 5);

    renderShelves();
}

function nextStage() {
    if (state.isTraining) {
        state.score = 0; state.stage = 1; state.runCommitted = false;
        startStage(false);
    } else {
        state.stage++;
        startStage(false);
    }
}

function gameOver(reason) {
    endRoundCleanup();
    state.sound.playDamage();
    vib([80, 40, 80]);
    const isTop = commitRun();
    const current = Math.floor(state.score);

    if (isTop) {
        gameoverTitleEl.textContent = 'おしい！【店長：だんだんいい感じになってきたな！】';
        gameoverReasonEl.innerHTML = `${reason}<br>クリアは逃したものの、自己ベストスコアを更新しました！<br><span style="color:#7dd3fc;font-weight:bold;">店長「手際は良くなってきているな。その調子で頑張れ！」</span>`;
    } else {
        const titles = [
            '店舗崩壊...【店長：もっときれいにしないとお客さんが困るだろ！】',
            '大叱責...【店長：上の人に怒られちまうよ！何やってんだ一体！】',
            '営業停止...【店長：これじゃあ棚がボロボロで誰も買ってくれねぇよ！】',
            '雷落つ...【SV：抜き打ちチェックでこれか！本社に報告させてもらう！】'
        ];
        const descs = [
            '商品が奥に引っ込んだままだし、めちゃくちゃだ！',
            'これではお客様が欲しい商品を見つけられずに出ていってしまうぞ！',
            '棚の乱れは心の乱れ！一から出直してきなさい！',
            'バックヤードでサボっていたのかと疑うレベルの荒れ果て方です。'
        ];
        const ri = Math.floor(Math.random() * titles.length);
        gameoverTitleEl.textContent = titles[ri];
        gameoverReasonEl.innerHTML = `${reason}<br>${descs[ri]}`;
    }
    finalStageEl.textContent = state.isTraining ? 'TR' : state.stage;
    finalScoreEl.innerHTML = `${current}` + (isTop ? '<br><span style="color:#fbbf24;font-size:12px;font-weight:bold;">★自己ベスト更新！</span>' : '');
    setManager('angry', null, 0);
    gameoverOverlay.classList.remove('hidden');
}

function returnToTitle() {
    if (!state.isTraining && !state.isPlaying) commitRun();
    cancelDrag();
    state.paused = false;
    $('quit-overlay').classList.add('hidden');
    clearOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');
    tutBanner.classList.add('hidden');
    if (state.loopTimer) clearInterval(state.loopTimer);
    state.isPlaying = false;
    renderRankingBoard();
    updateUI();
    startOverlay.classList.remove('hidden');
}

/* ================= ボタン ================= */
$('start-btn').addEventListener('click', () => { state.score = 0; state.stage = 1; state.runCommitted = false; startStage(false); });
$('training-btn').addEventListener('click', () => { state.score = 0; state.stage = 1; startStage(true); });
$('next-btn').addEventListener('click', nextStage);
$('retry-btn').addEventListener('click', () => {
    state.score = 0; state.runCommitted = false;
    if (!state.isTraining) state.stage = 1;
    startStage(state.isTraining);
});
$('quit-btn').addEventListener('click', () => {
    if (!startOverlay.classList.contains('hidden')) return;
    state.paused = true;
    cancelDrag(); stopSwipe();
    $('quit-overlay').classList.remove('hidden');
});
$('quit-resume-btn').addEventListener('click', () => {
    state.paused = false;
    $('quit-overlay').classList.add('hidden');
});
$('quit-confirm-btn').addEventListener('click', () => {
    state.isPlaying = false;
    if (!state.isTraining) commitRun();
    returnToTitle();
});
$('clear-title-btn').addEventListener('click', returnToTitle);
$('gameover-title-btn').addEventListener('click', returnToTitle);

/* ================= 初期化 ================= */
renderRankingBoard();
setupStageLayout();
setManager('normal', null, 0);
updateUI();
</script>
</body>
</html>
